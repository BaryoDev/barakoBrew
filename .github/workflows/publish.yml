name: Publish

# Every merge to master pushes ghcr.io/baryodev/barako-admin:dev and :dev-<sha>. A v* tag pushes
# :latest and :<version>, then builds the base-path image playground.baryo.dev runs, pushes it as
# :playground and :playground-<version>, and deploys it there over SSH. Tagging is the release
# switch; nothing else publishes.
#
# Both architectures, always. The playground VM is arm64 and an amd64-only image has bitten this
# project before. Each architecture is built on a runner of that architecture and pushed by digest,
# then joined into one manifest list, so a half-finished matrix cannot leave a tag pointing at one
# architecture.

on:
  push:
    branches: ["master"]
    tags: ["v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*)
              V="${GITHUB_REF#refs/tags/v}"
              # Anchored, because a `case` glob is not. `[0-9]*.[0-9]*.[0-9]*` matches
              # `1.2.3$(id)` and a value with a newline in it, and this one reaches a shell twice
              # more: the tag list the image is pushed under, and the playground summary. A
              # workflow holding registry credentials and an SSH key should not take a version it
              # has not read.
              [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
                echo "::error::tag v$V is not a version"; exit 1; }
              echo "version=$V" >> "$GITHUB_OUTPUT"
              echo "is_release=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
              echo "is_release=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  # CI does not run on master pushes or tags, so re-check here rather than assume. The production
  # build happens inside the image.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run

  build:
    name: Build ${{ matrix.arch }}
    needs: [version, verify]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          # Stamped from the tag rather than read from package.json, which has said 0.1.0 since
          # the beginning.
          build-args: |
            BARAKO_VERSION=${{ needs.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/BaryoDev/barakoBrew
          outputs: type=image,name=ghcr.io/baryodev/barako-admin,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # An empty digest here would make the merge step below build a manifest out of nothing, so it
      # fails now rather than producing an image that resolves to no architectures.
      - name: Record the digest
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::build produced no usable digest, got '$DIGEST'"; exit 1 ;;
          esac
          mkdir -p /tmp/digests
          echo "$DIGEST" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ needs.version.outputs.is_release == 'true' && 'release' || 'dev' }} tags
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IS_RELEASE: ${{ needs.version.outputs.is_release }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (optional mirror)
        id: dockerhub
        if: env.IS_RELEASE == 'true'
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create the manifest list
        id: tags
        run: |
          set -euo pipefail
          IMG=ghcr.io/baryodev/barako-admin
          REFS=""
          for arch in amd64 arm64; do
            F="/tmp/digests/$arch"
            [ -s "$F" ] || { echo "::error::no digest for $arch, refusing to publish a single-architecture image"; exit 1; }
            REFS="$REFS $IMG@$(cat "$F")"
          done
          if [ "$IS_RELEASE" = "true" ]; then
            TAGS="latest $VERSION"
          else
            TAGS="dev dev-${GITHUB_SHA}"
          fi
          ARGS=""
          for t in $TAGS; do ARGS="$ARGS --tag $IMG:$t"; done
          docker buildx imagetools create $ARGS $REFS
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "pushed: $TAGS" >> "$GITHUB_STEP_SUMMARY"

      # Checked on the pushed manifest rather than on the build config, because the config being
      # right is not evidence that the push was. A single-architecture image is invisible to
      # everyone except whoever pulls it on the wrong hardware.
      - name: Every published tag serves both architectures
        run: |
          set -euo pipefail
          IMG=ghcr.io/baryodev/barako-admin
          for t in ${{ steps.tags.outputs.tags }}; do
            PLATFORMS=$(docker buildx imagetools inspect --raw "$IMG:$t" \
              | jq -r '[.manifests[]? | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"] | sort | join(",")')
            case "$PLATFORMS" in
              ''|*[!a-z0-9/,]*) echo "::error::could not read platforms for $IMG:$t, got '$PLATFORMS'"; exit 1 ;;
            esac
            echo "$IMG:$t serves $PLATFORMS" >> "$GITHUB_STEP_SUMMARY"
            [ "$PLATFORMS" = "linux/amd64,linux/arm64" ] || {
              echo "::error::$IMG:$t publishes '$PLATFORMS', expected linux/amd64,linux/arm64"; exit 1; }
          done

      # imagetools create on a manifest list copies the list, so the mirror is multi-architecture
      # too. It would silently mirror one architecture if the source were single-architecture,
      # which is the other reason the check above runs before this.
      - name: Mirror to Docker Hub
        if: env.IS_RELEASE == 'true' && steps.dockerhub.outcome == 'success'
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "arnelirobles/barako-admin:latest" \
            --tag "arnelirobles/barako-admin:$VERSION" \
            "ghcr.io/baryodev/barako-admin:$VERSION"

  # The playground image is a different build, not a retag: NEXT_BASE_PATH is baked in at build time
  # and the VM serves the console under /barakocms. Native arm64 because the VM is Ampere.
  playground-image:
    name: Build the playground image
    needs: [version, publish]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            NEXT_BASE_PATH=/barakocms
            NEXT_PUBLIC_API_URL=https://playground.baryo.dev/barakocms-api
            BARAKO_VERSION=${{ needs.version.outputs.version }}
          tags: |
            ghcr.io/baryodev/barako-admin:playground
            ghcr.io/baryodev/barako-admin:playground-${{ needs.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/BaryoDev/barakoBrew
          cache-from: type=gha,scope=pg-admin
          cache-to: type=gha,mode=max,scope=pg-admin

  deploy-playground:
    name: Deploy to playground
    needs: [version, playground-image]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: playground
      url: https://playground.baryo.dev/barakocms
    steps:
      # The key is pinned to a forced command in the VM's authorized_keys, so whatever we send here
      # is ignored and the deploy script on the VM runs instead. A leaked key cannot open a shell.
      # The script pulls :playground, recreates the container, and fails if it does not answer 200.
      - name: Pull and restart the console over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.PLAYGROUND_DEPLOY_KEY }}
          command_timeout: 5m
          script: deploy

      - name: Verify from the public URL
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              https://playground.baryo.dev/barakocms || true)
            if [ "$code" = "200" ]; then
              echo "playground responded 200 after ${i} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "playground did not return 200 (last: ${code:-none})" >&2
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Playground deploy"
            echo ""
            echo "- image: \`ghcr.io/baryodev/barako-admin:playground-${{ needs.version.outputs.version }}\`"
            echo "- url: https://playground.baryo.dev/barakocms"
            echo "- result: ${{ job.status }}"
            echo ""
            echo "Roll back by retagging a previous \`playground-<version>\` to \`:playground\` and re-running this job."
          } >> "$GITHUB_STEP_SUMMARY"
