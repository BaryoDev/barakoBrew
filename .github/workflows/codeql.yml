name: CodeQL

# Static analysis for code-level problems (injection, unsafe DOM writes, auth logic) that the
# dependency audit does not see. Findings land in the Security tab and as PR annotations.
on:
  push:
    branches: ["master"]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: ["master"]
    paths-ignore: ["**/*.md"]
  schedule:
    - cron: "27 3 * * 1" # weekly, so drift is caught even without a push

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: "/language:javascript-typescript"
