name: CodeQL

# Static analysis for code-level problems (injection, unsafe DOM writes, auth logic) that the
# dependency audit does not see. Findings land in the Security tab and as PR annotations.
on:
  push:
    branches: ["master"]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: ["master"]
    paths-ignore: ["**/*.md"]
  schedule:
    - cron: "27 3 * * 1" # weekly, so drift is caught even without a push

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
