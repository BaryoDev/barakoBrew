name: CodeQL

# Static analysis for code-level problems (injection, unsafe DOM writes, auth logic) that the
# dependency audit does not see. Findings land in the Security tab and as PR annotations.
on:
  push:
    branches: ["master"]
    paths-ignore: ["**/*.md"]
  # No paths filter on pull requests. CodeQL is a required check, and a required check that never
  # starts on a docs-only pull request leaves it blocked with nothing to wait for.
  pull_request:
    branches: ["master"]
  # The merge queue only counts a required check that reports on the merge_group event, the same
  # reason ci.yml declares it. Without this the queue waits for CodeQL forever.
  merge_group:
  schedule:
    - cron: "27 3 * * 1" # weekly, so drift is caught even without a push

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: "/language:javascript-typescript"
