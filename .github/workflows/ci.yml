name: CI

on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches: ["master"]
  # The merge queue tests a batch of PRs against master together, then merges them in order. Without
  # this trigger the queue waits forever for checks that never start, because a required check only
  # counts when it reports on the merge_group event.
  merge_group:
  # Nightly, for the smoke job only. The API is published from another repository, so a change
  # there never pushes here. This is how an API change surfaces without anyone pushing.
  schedule:
    - cron: "23 18 * * *"

jobs:
  console:
    name: Console (lint, types, unit)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Three sequential steps, so a failure in the first would hide the state of the other two.
      # That is how the console's typecheck and unit suite stayed invisible for the whole life of
      # this repository: lint failed on a vendored file, the two steps after it were skipped, and
      # the setup was abandoned without anyone learning whether they passed.
      - name: Typecheck
        if: '!cancelled()'
        run: npx tsc --noEmit

      # A run that discovers no test files exits zero, so the count is asserted rather than the
      # status. Read from the JSON reporter, not the console output: the human output is
      # ANSI-coloured under CI and not under a local pipe, so a grep passes on a laptop and fails
      # on the runner.
      #
      # A floor rather than `> 0`, because `> 0` stays green when a whole directory drops out of
      # the glob. 238 tests in 20 files pass today; 200 leaves room to delete a file on purpose and
      # still fails if a directory disappears.
      - name: Unit tests
        if: '!cancelled()'
        run: |
          set -o pipefail
          npx vitest run --reporter=default --reporter=json --outputFile.json=unit-results.json
          COUNT=$(jq -r '.numTotalTests // 0' unit-results.json)
          [ "$COUNT" -ge 200 ] 2>/dev/null || {
            echo "::error::vitest discovered $COUNT tests, below the floor of 200"; exit 1; }
          echo "unit tests: $COUNT" >> "$GITHUB_STEP_SUMMARY"

      # Every check above this one reads text. Images are not text, so nothing above can see what
      # is inside them. The screenshots in the design handoff each arrived carrying a 5,758 byte
      # C2PA manifest naming the tool that generated them, and every other gate was green.
      #
      # The whole tree, not the diff: the first run of this found metadata in a file that had been
      # committed long before the change that added the check.
      - name: Assets carry no provenance metadata
        if: '!cancelled()'
        run: python3 scripts/asset-provenance.py .

  audit:
    name: Audit dependencies
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Dependency vulnerability gate: Critical or High fails the build. The step is the one the API
      # repository runs for this same lockfile, copied whole, so the two hold the same line. It used
      # to fail on Critical only, because three High advisories in `next` had no fix we could take
      # and a permanently red gate is one everybody learns to ignore. Taking Next 16.3 cleared them.
      - name: Audit dependencies (fail on Critical or High)
        run: |
          # `npm audit` exits non-zero when it finds anything, so its status cannot distinguish
          # "found vulnerabilities" from "could not run". The report itself is the signal, and an
          # unreadable one fails the build rather than passing: a gate that cannot see must not wave
          # things through.
          # The registry's audit endpoint has gone away for minutes at a time (503, or a hang), which
          # made every run fail for a reason that had nothing to do with the code. Retry for a while
          # before concluding that the report is unreadable. The gate below still fails closed.
          for attempt in 1 2 3 4 5; do
            timeout 180 npm audit --json > audit.json || true
            if jq -e '.metadata.vulnerabilities.total' audit.json >/dev/null 2>&1; then break; fi
            echo "npm audit attempt $attempt returned no report, retrying in 60s"
            sleep 60
          done

          CRIT=$(jq -r '.metadata.vulnerabilities.critical // empty' audit.json 2>/dev/null || true)
          HIGH=$(jq -r '.metadata.vulnerabilities.high // empty' audit.json 2>/dev/null || true)
          case "${CRIT}|${HIGH}" in
            *[!0-9]\|*|*\|*[!0-9]*|\|*|*\|)
              echo "::error::npm audit did not return a usable report, failing closed"
              head -c 500 audit.json || true
              exit 1
              ;;
          esac

          echo "npm audit: critical=$CRIT high=$HIGH" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CRIT" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "::error::npm audit found $CRIT critical and $HIGH high severity vulnerabilities"
            jq -r '.vulnerabilities | to_entries[]
                   | select(.value.severity == "critical" or .value.severity == "high")
                   | "\(.value.severity)\t\(.key)"' audit.json
            exit 1
          fi

  e2e:
    name: End to end (Playwright and axe)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # WebKit as well as Chromium, because Mobile Safari is the only WebKit project and it is the
      # one that covers the browser this console is otherwise never tested in.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # The job name promises an axe pass. A renamed or deleted accessibility spec would leave the
      # promise and remove the pass, so the listing is checked before anything runs.
      #
      # The project list is checked for the same reason. `--project` fails silently by matching
      # nothing, so a typo or a renamed project would quietly shrink the run to whatever was left,
      # and a green tick would say the same thing either way.
      - name: The accessibility spec and every project are in the run
        run: |
          set -euo pipefail
          npx playwright test --list > listing.txt
          grep -q 'accessibility.spec.ts' listing.txt || {
            echo "::error::e2e/accessibility.spec.ts is not in the Playwright listing; the axe pass would not run"; exit 1; }

          for project in chromium 'Mobile Chrome' 'Mobile Safari'; do
            grep -q "\[$project\]" listing.txt || {
              echo "::error::no tests listed for project '$project'"; exit 1; }
          done

      # Drives the real UI against a mocked API to catch the class of bug unit tests miss:
      # empty-vs-error states, routing, forms, per-field-type controls.
      #
      # Every project, not just chromium. The config has always declared three, and running one of
      # them meant the config described coverage nobody had: anyone reading it, or running
      # `npx playwright test` locally with no argument, got a different answer from CI. Measured
      # before switching it on rather than assumed: all three pass, 199 tests in 1.1 minutes against
      # 70 in 28 seconds.
      - name: E2E (full pack, every project)
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  image:
    name: Image builds
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # No push. The published image is built by publish.yml; this proves the Dockerfile still
      # builds from a pull request before it merges.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: barako-admin:ci
          build-args: |
            BARAKO_VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build that succeeds is not a container that starts. entrypoint.sh has to write
      # env-config.js from NEXT_PUBLIC_API_URL and the standalone server has to answer, or the
      # image is a tarball nobody can run.
      - name: The image starts and reads its API URL at start
        run: |
          set -euo pipefail
          docker run -d --name ci-admin -p 3300:3000 \
            -e NEXT_PUBLIC_API_URL=http://api.example.test:5005 barako-admin:ci
          for _ in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3300/login || true)" = "200" ] && break
            sleep 2
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3300/login || true)
          [ "$code" = "200" ] || { docker logs ci-admin; echo "::error::/login answered $code"; exit 1; }
          curl -s http://127.0.0.1:3300/env-config.js | tee env-config.js
          grep -q 'NEXT_PUBLIC_API_URL: "http://api.example.test:5005"' env-config.js || {
            echo "::error::env-config.js does not carry the NEXT_PUBLIC_API_URL the container was started with"; exit 1; }
          docker rm -f ci-admin >/dev/null

      # `docker compose config` parses the file, resolves every variable and fails on the first one
      # that has no value. The quickstart is what a newcomer runs first, so a broken one costs the
      # most at the worst moment.
      - name: The quickstart compose file resolves
        env:
          DB_PASSWORD: ci-not-a-real-password
          JWT_KEY: ci-not-a-real-key-at-least-32-characters
          ADMIN_PASSWORD: ci-not-a-real-password
        run: |
          set -euo pipefail
          docker compose -f quickstart/docker-compose.yml config > quickstart.resolved
          grep -q 'ghcr.io/baryodev/barako-cms:' quickstart.resolved
          grep -q 'ghcr.io/baryodev/barako-admin:' quickstart.resolved
          if grep -qE '^[[:space:]]+build:' quickstart.resolved; then
            echo "::error::quickstart/docker-compose.yml resolves to a build step; it must run published images"; exit 1
          fi
          echo "quickstart/docker-compose.yml resolves"

  sbom:
    name: SBOM generates
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The same command as the API repository's release used for this image, so the file a release
      # ships is the file this job proves. A tool that writes nothing still exits 0, so the file is
      # checked rather than the command.
      - name: Generate the SBOM
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          mkdir -p sbom
          npx --yes @cyclonedx/cyclonedx-npm --output-file sbom/barako-admin.cdx.json package.json
          f=sbom/barako-admin.cdx.json
          [ -s "$f" ] || { echo "::error::$f is missing or empty."; exit 1; }
          COMPONENTS=$(python3 -c "import json; print(len(json.load(open('$f')).get('components', [])))")
          [ "$COMPONENTS" -gt 0 ] || { echo "::error::$f lists no components, so it describes nothing."; exit 1; }
          echo "$f: $COMPONENTS components" >> "$GITHUB_STEP_SUMMARY"

  # The console against the real API, with nothing mocked.
  #
  # Every other job mocks the API with page.route, so it proves the console behaves correctly given
  # fixtures the same person wrote, and cannot prove those fixtures match the server. That gap
  # shipped a bug and kept it: the History panel read `versions` from a response that had returned
  # `items` since the envelope change, rendered an empty list rather than failing, and every mocked
  # spec stayed green because the mock returned `versions` too.
  #
  # An arm runner, because ghcr.io/baryodev/barako-cms:playground is built for the Ampere VM and
  # exists only as arm64. Free for public repositories.
  smoke:
    name: Console against the real API
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Which API image the pack runs against is a repository variable, so pointing it at a newer
      # tag is a settings change rather than a pull request. Unset, it is :playground, the build
      # that runs playground.baryo.dev.
      - name: Stand up the stack and run the unmocked pack
        env:
          BARAKO_API_TAG: ${{ vars.BARAKO_API_TAG || 'playground' }}
        run: bash scripts/smoke-check.sh

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Proves the release gate can fail, rather than trusting it because it has never fired.
  #
  # scripts/check-image-platforms.sh is what stands between a release and an amd64-only tag, and it
  # runs only during a publish, which is the one place it is expensive to be wrong. So it is
  # exercised here against two published tags whose shape is already known: barako-admin:3.21.0 is
  # amd64 only, which is the defect #37 is about, and :latest carries both architectures.
  #
  # Both directions on purpose. A gate that refuses everything would satisfy the negative case
  # alone and block every release.
  image-platform-gate:
    name: Image platform gate refuses an amd64-only tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The script only reads a public registry; leave no token behind for it to find.
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4

      - name: An amd64-only tag is refused, and for the right reason
        run: |
          set -uo pipefail
          # Actions runs this under bash -e. Capturing the status on the same line keeps -e from
          # ending the step at the assignment, before the output is read.
          code=0
          out=$(bash scripts/check-image-platforms.sh ghcr.io/baryodev/barako-admin:3.21.0 2>&1) || code=$?
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::the gate passed an amd64-only tag"; exit 1
          fi
          # A network error also exits 1. Only the mismatch message counts as the gate working.
          echo "$out" | grep -q "serves 'linux/amd64', expected 'linux/amd64,linux/arm64'" || {
            echo "::error::the gate failed, but not because the tag is amd64 only (exit $code)"; exit 1; }

      - name: A multi-architecture tag is accepted
        run: bash scripts/check-image-platforms.sh ghcr.io/baryodev/barako-admin:latest
