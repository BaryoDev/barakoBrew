name: CI

on:
  # No push trigger here. A branch with an open pull request matches both push and pull_request, so
  # every push ran this workflow twice on one commit (#96). Branch pushes arrive through
  # ci-branch.yml, which calls this workflow only when no pull_request run covers the commit.
  workflow_call:
  pull_request:
    branches: ["master"]
  # The merge queue tests a batch of PRs against master together, then merges them in order. Without
  # this trigger the queue waits forever for checks that never start, because a required check only
  # counts when it reports on the merge_group event.
  merge_group:
  # Nightly, for the smoke job only. The API is published from another repository, so a change
  # there never pushes here. This is how an API change surfaces without anyone pushing.
  schedule:
    - cron: "23 18 * * *"
  # Runs the nightly on demand: the smoke job picks the same API tag for this event as for schedule.
  workflow_dispatch:

jobs:
  console:
    name: Console (lint, types, unit)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Three sequential steps, so a failure in the first would hide the state of the other two.
      # That is how the console's typecheck and unit suite stayed invisible for the whole life of
      # this repository: lint failed on a vendored file, the two steps after it were skipped, and
      # the setup was abandoned without anyone learning whether they passed.
      - name: Typecheck
        if: '!cancelled()'
        run: npx tsc --noEmit

      # A run that discovers no test files exits zero, so the count is asserted rather than the
      # status. Read from the JSON reporter, not the console output: the human output is
      # ANSI-coloured under CI and not under a local pipe, so a grep passes on a laptop and fails
      # on the runner.
      #
      # A floor rather than `> 0`, because `> 0` stays green when a whole directory drops out of
      # the glob. 238 tests in 20 files pass today; 200 leaves room to delete a file on purpose and
      # still fails if a directory disappears.
      - name: Unit tests
        if: '!cancelled()'
        run: |
          set -o pipefail
          npx vitest run --reporter=default --reporter=json --outputFile.json=unit-results.json
          COUNT=$(jq -r '.numTotalTests // 0' unit-results.json)
          [ "$COUNT" -ge 200 ] 2>/dev/null || {
            echo "::error::vitest discovered $COUNT tests, below the floor of 200"; exit 1; }
          echo "unit tests: $COUNT" >> "$GITHUB_STEP_SUMMARY"

      # Every check above this one reads text. Images are not text, so nothing above can see what
      # is inside them. The screenshots in the design handoff each arrived carrying a 5,758 byte
      # C2PA manifest naming the tool that generated them, and every other gate was green.
      #
      # The whole tree, not the diff: the first run of this found metadata in a file that had been
      # committed long before the change that added the check.
      - name: Assets carry no provenance metadata
        if: '!cancelled()'
        run: python3 scripts/asset-provenance.py .

      # entrypoint.sh builds env-config.js, a script every page loads, from the container's
      # environment. This runs it with names and values meant to leak or break out, and reads the
      # file back as JavaScript.
      - name: env-config.js carries only NEXT_PUBLIC_ variables, encoded
        if: '!cancelled()'
        run: bash scripts/check-env-config.sh

      # The wiki workflow is green or red on this script's exit code alone, so a rejected push or a
      # failed sync that still exited zero would leave the wiki stale under a green run. A local
      # bare repository stands in for the wiki, so this step never touches the network.
      - name: The wiki publish fails when the wiki was not updated
        if: '!cancelled()'
        run: bash scripts/test-wiki-publish.sh

  # Secrets in the tree or in history. The scanner is the gitleaks release binary, checked against a
  # pinned checksum from the release's own checksums file before it is extracted. A scan that finds
  # nothing looks the same as a scan that is not running, so the second step plants a credential and
  # fails if the scan does not catch it.
  secrets:
    name: Secret scan (gitleaks)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # History, not one commit. The default depth gives the scan almost nothing to read.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSL --fail -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Secret scan
        run: gitleaks git . --config .gitleaks.toml --redact --verbose

      # Scans a scratch directory, so clone depth cannot break it, with the repository's own config.
      # Each planted secret is its own file and the report is read back, so the check needs both
      # default rules to fire, not any one of them. The prefixes are assembled from halves, because
      # written whole they would match the rules and flag this file. The AWS rule only accepts
      # A-Z and 2-7 after the prefix. Bounded reads first: piping /dev/urandom into `tr | head -c N`
      # kills tr with SIGPIPE and, under pipefail, fails the assignment before the scan runs.
      - name: The scan catches a planted credential
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          mkdir "$TMP/plant"
          AWS_P="AK"; AWS_P="${AWS_P}IA" # allow-secret
          GH_P="gh"; GH_P="${GH_P}p_" # allow-secret
          AWS_SUFFIX=$(head -c 4096 /dev/urandom | LC_ALL=C tr -dc 'A-Z2-7' | cut -c1-16)
          GH_SUFFIX=$(head -c 4096 /dev/urandom | LC_ALL=C tr -dc 'A-Za-z0-9' | cut -c1-36)
          [ "${#AWS_SUFFIX}" -eq 16 ] && [ "${#GH_SUFFIX}" -eq 36 ] || { echo "::error::could not build the planted values"; exit 1; }
          printf 'aws_access_key_id = "%s%s"\n' "$AWS_P" "$AWS_SUFFIX" > "$TMP/plant/aws.txt" # allow-secret
          printf 'gh_token = "%s%s"\n' "$GH_P" "$GH_SUFFIX" > "$TMP/plant/github.txt" # allow-secret

          # gitleaks exits 1 for a leak and for an error alike, so ask for 42 on a leak. Anything
          # else is a broken run.
          code=0
          gitleaks dir "$TMP/plant" --config .gitleaks.toml --redact --no-banner --exit-code 42 \
            --report-format json --report-path "$TMP/report.json" || code=$?
          if [ "$code" -ne 42 ]; then
            echo "::error::gitleaks exited $code on the planted credentials, wanted 42. The gate is not working."
            exit 1
          fi
          for rule in aws-access-token github-pat; do
            if ! jq -e --arg r "$rule" 'any(.[]; .RuleID == $r)' "$TMP/report.json" >/dev/null; then
              echo "::error::The secret scan did not report rule $rule for its planted credential. The gate is not working."
              exit 1
            fi
          done
          echo "Both planted secrets were caught. The scan is live."

  audit:
    name: Audit dependencies
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Dependency vulnerability gate: Critical or High fails the build. The step is the one the API
      # repository runs for this same lockfile, copied whole, so the two hold the same line. It used
      # to fail on Critical only, because three High advisories in `next` had no fix we could take
      # and a permanently red gate is one everybody learns to ignore. Taking Next 16.3 cleared them.
      - name: The audit gate keeps its rules
        run: bash scripts/test-audit-gate.sh

      # ci-branch.yml calls this file. A called workflow cannot ask for more than its caller grants,
      # and that is checked at startup for every job, so a permission added here and not there fails
      # every branch-push run before it starts.
      - name: The branch caller grants every permission this workflow declares
        run: python3 scripts/check-workflow-permissions.py .github/workflows/ci.yml .github/workflows/ci-branch.yml

      - name: Audit dependencies (fail on Critical or High)
        run: |
          # `npm audit` exits non-zero when it finds anything, so its status cannot distinguish
          # "found vulnerabilities" from "could not run". The report itself is the signal, and an
          # unreadable one fails the build rather than passing: a gate that cannot see must not wave
          # things through.
          # The registry's audit endpoint has gone away for minutes at a time (503, or a hang), which
          # made every run fail for a reason that had nothing to do with the code. Retry for a while
          # before concluding that the report is unreadable. The gate below still fails closed.
          for attempt in 1 2 3 4 5; do
            timeout 180 npm audit --json > audit.json || true
            if jq -e '.metadata.vulnerabilities.total' audit.json >/dev/null 2>&1; then break; fi
            echo "npm audit attempt $attempt returned no report, retrying in 60s"
            sleep 60
          done

          # Counts advisories, and accepts one only while .github/audit-allowlist.json names it
          # with a reason and an unexpired date (see scripts/audit-gate.sh).
          bash scripts/audit-gate.sh audit.json | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

  # Licence gate (#39). MPL-2.0 is file-level copyleft and §3.3 lets MPL files be combined into a
  # Larger Work under other terms, so permissive dependencies are fine. What must not enter the tree
  # is GPL, AGPL, LGPL, SSPL, BUSL, Elastic, "fair source", or a package with no machine-readable
  # licence field. AGPL is the one that costs money later: CLA.md names it as what enterprise buyers
  # refuse, and the console is the part a company deploys.
  #
  # Both directions in one job, the same shape as image-platform-gate below. A gate that has only
  # ever been green is not evidence that it works.
  licences:
    name: Licence gate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A floor on the package count, for the same reason the unit suite asserts one: a report that
      # covers nothing still exits 0. 569 packages install on a developer machine today, and the
      # runner installs a different set of platform binaries, so 400 leaves room for that without
      # accepting a report that saw almost nothing.
      - name: Every licence in the tree is on the allow list
        run: bash scripts/check-licences.sh . 400

      # The gate proved against a package that must be refused. ffmpeg-static is genuinely
      # GPL-3.0-or-later and small, and pinning the version keeps this from turning red the day the
      # package relicenses. --ignore-scripts because its postinstall downloads an ffmpeg binary that
      # has nothing to do with the licence field.
      #
      # The scratch install lives outside the checkout, so the probe cannot reach the real
      # node_modules the step above just checked.
      - name: The gate refuses a GPL dependency
        run: |
          set -uo pipefail
          probe=$(mktemp -d)
          (cd "$probe" && npm init -y >/dev/null && \
            npm install --ignore-scripts --no-audit --no-fund ffmpeg-static@5.3.0 >/dev/null)

          # Actions runs this under bash -e. Capturing the status on the same line keeps -e from
          # ending the step at the assignment, before the output is read.
          code=0
          out=$(bash scripts/check-licences.sh "$probe" 2>&1) || code=$?
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::the gate passed a tree holding a GPL package"; exit 1
          fi
          # A registry or jq failure also exits 1. Only the refusal message counts as the gate
          # working, and it has to name the package or a maintainer cannot act on it.
          echo "$out" | grep -q "ffmpeg-static@5.3.0 is GPL-3.0-or-later" || {
            echo "::error::the gate failed, but not because of the GPL package (exit $code)"; exit 1; }

  e2e:
    name: End to end (Playwright and axe)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # WebKit as well as Chromium, because Mobile Safari is the only WebKit project and it is the
      # one that covers the browser this console is otherwise never tested in.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # The job name promises an axe pass. A renamed or deleted accessibility spec would leave the
      # promise and remove the pass, so the listing is checked before anything runs.
      #
      # The project list is checked for the same reason. `--project` fails silently by matching
      # nothing, so a typo or a renamed project would quietly shrink the run to whatever was left,
      # and a green tick would say the same thing either way.
      - name: The accessibility spec and every project are in the run
        run: |
          set -euo pipefail
          npx playwright test --list > listing.txt
          grep -q 'accessibility.spec.ts' listing.txt || {
            echo "::error::e2e/accessibility.spec.ts is not in the Playwright listing; the axe pass would not run"; exit 1; }

          for project in chromium 'Mobile Chrome' 'Mobile Safari'; do
            grep -q "\[$project\]" listing.txt || {
              echo "::error::no tests listed for project '$project'"; exit 1; }
          done

      # Drives the real UI against a mocked API to catch the class of bug unit tests miss:
      # empty-vs-error states, routing, forms, per-field-type controls.
      #
      # Every project, not just chromium. The config has always declared three, and running one of
      # them meant the config described coverage nobody had: anyone reading it, or running
      # `npx playwright test` locally with no argument, got a different answer from CI. Measured
      # before switching it on rather than assumed: all three pass, 199 tests in 1.1 minutes against
      # 70 in 28 seconds.
      - name: E2E (full pack, every project)
        run: npx playwright test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  image:
    name: Image builds
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: The scan gate fails on the reports it must refuse
        run: bash scripts/test-image-scan-gate.sh

      # No push. The published image is built by publish.yml; this proves the Dockerfile still
      # builds from a pull request before it merges.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: barako-brew:ci
          build-args: |
            BARAKO_VERSION=0.0.0-ci
          # The fonts are files in src/app/fonts, so the build has no reason to reach Google Fonts.
          # Pointing both hosts at nothing makes that a gate: next/font/google fails the build
          # outright when it cannot fetch, where a slow answer only failed it some of the time (#196).
          add-hosts: |
            fonts.googleapis.com:0.0.0.0
            fonts.gstatic.com:0.0.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Known vulnerabilities in the built image: Alpine packages and the traced node_modules. Trivy
      # has no analyzer for the node runtime in /usr/local/bin, so node itself is kept current by the
      # base image digest pin and Dependabot, not by this scan. High or Critical with a fix fails, unless .github/audit-allowlist.json names
      # the id with a reason and an unexpired date. A finding with no fix yet is reported and does
      # not fail. The scanner is a release binary checked against a pinned checksum.
      - name: Install Trivy
        run: bash scripts/install-trivy.sh

      - name: The image has no fixable High or Critical vulnerability
        run: |
          set -uo pipefail
          trivy image --scanners vuln --severity HIGH,CRITICAL --format json \
            --output image-scan.json barako-brew:ci
          bash scripts/image-scan-gate.sh image-scan.json | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      # What the image redistributes, read out of the image. The tree gate in the licences job
      # answers what comes in, and the two differ: the runtime stage copies Next's traced output,
      # not node_modules, which is how 27MB of LGPL libvips shipped while the tree gate was green
      # (#76).
      - name: The image ships no copyleft
        run: bash scripts/check-image-licences.sh --image barako-brew:ci

      # Proven to fail, against a fixture holding the package that actually shipped. A gate nobody
      # has watched refuse is a gate nobody should trust, and a non-zero exit on its own is not
      # evidence: a typo in the script exits non-zero too. Both cases assert the reason.
      - name: The artifact licence gate refuses an LGPL package
        run: |
          set -uo pipefail
          # `|| code=$?` rather than a bare assignment and `$?` after it: the step's shell is
          # `bash -e`, so an assignment from a command that exits non-zero ends the step there, and
          # the gate failing is the whole point of this step.
          code=0
          out=$(bash scripts/check-image-licences.sh --dir scripts/testdata/image-licences-known-bad 2>&1) || code=$?
          echo "$out"
          [ "$code" -ne 0 ] || { echo "::error::the gate passed a tree holding an LGPL package"; exit 1; }
          echo "$out" | grep -q 'sharp-libvips-linux-x64 LGPL-3.0-or-later' || {
            echo "::error::the gate failed, but not because of the LGPL fixture"; exit 1; }

      - name: The artifact licence gate refuses a package with no licence field
        run: |
          set -uo pipefail
          # `|| code=$?` rather than a bare assignment and `$?` after it: the step's shell is
          # `bash -e`, so an assignment from a command that exits non-zero ends the step there, and
          # the gate failing is the whole point of this step.
          code=0
          out=$(bash scripts/check-image-licences.sh --dir scripts/testdata/image-licences-known-bad-nolicence 2>&1) || code=$?
          echo "$out"
          [ "$code" -ne 0 ] || { echo "::error::the gate passed a package with no licence field"; exit 1; }
          echo "$out" | grep -q 'mystery-package (UNKNOWN)' || {
            echo "::error::the gate failed, but not because of the unlicensed fixture"; exit 1; }

      # A build that succeeds is not a container that starts. entrypoint.sh has to write
      # env-config.js from NEXT_PUBLIC_API_URL and the standalone server has to answer, or the
      # image is a tarball nobody can run.
      # Started with a read-only root filesystem, which is how the quickstart runs it, so a start
      # that writes into the image fails here and not on somebody's server. The image's own
      # HEALTHCHECK has to go healthy too.
      - name: The image starts and reads its API URL at start
        run: |
          set -euo pipefail
          docker run -d --name ci-admin -p 3300:3000 \
            --read-only --tmpfs /tmp:rw,mode=1777,size=128m \
            -e NEXT_PUBLIC_API_URL=http://api.example.test:5005 barako-brew:ci
          for _ in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3300/login || true)" = "200" ] && break
            sleep 2
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3300/login || true)
          [ "$code" = "200" ] || { docker logs ci-admin; echo "::error::/login answered $code"; exit 1; }
          curl -s http://127.0.0.1:3300/env-config.js | tee env-config.js
          grep -q 'NEXT_PUBLIC_API_URL: "http://api.example.test:5005"' env-config.js || {
            echo "::error::env-config.js does not carry the NEXT_PUBLIC_API_URL the container was started with"; exit 1; }
          # The header the running server sends, not a file in the image. The build bakes a
          # placeholder into the policy and the entrypoint swaps in the API origin at start, so a
          # swap that misses leaves a console whose browser may not call its own API.
          curl -s -D - -o /dev/null http://127.0.0.1:3300/login | tr -d '\r' > headers.txt
          csp=$(grep -i '^content-security-policy:' headers.txt || true)
          n=$(printf '%s' "$csp" | grep -c . || true)
          [ "$n" -le 1 ] || { echo "$csp"; echo "::error::/login sent $n Content-Security-Policy headers, expected one"; exit 1; }
          [ -n "$csp" ] || { cat headers.txt; echo "::error::/login sent no Content-Security-Policy header"; exit 1; }
          # Scripts run only with this response's nonce. No 'unsafe-inline' in script-src, and the
          # nonce in the header must be on a script in the body the same response served.
          script_src=$(echo "$csp" | tr ';' '\n' | grep -E '^[[:space:]]*script-src' || true)
          echo "$script_src" | grep -q "'nonce-" || { echo "$csp"; echo "::error::script-src carries no nonce"; exit 1; }
          echo "$script_src" | grep -q "'strict-dynamic'" || { echo "$csp"; echo "::error::script-src lacks 'strict-dynamic'"; exit 1; }
          if echo "$script_src" | grep -q "'unsafe-inline'"; then
            echo "$csp"; echo "::error::script-src allows 'unsafe-inline'"; exit 1
          fi
          curl -s -D headers2.txt http://127.0.0.1:3300/login > body.html
          nonce2=$(tr -d '\r' < headers2.txt | grep -i '^content-security-policy:' | sed -E "s/.*'nonce-([^']+)'.*/\1/")
          grep -o '<script[^>]*>' body.html | grep -qF "nonce=\"$nonce2\"" || {
            echo "::error::no <script> in the /login body carries the nonce from the same response's header"; exit 1; }
          if echo "$csp" | grep -q '__BARAKO_CONNECT_ORIGINS__'; then
            echo "$csp"; echo "::error::the Content-Security-Policy still carries the __BARAKO_CONNECT_ORIGINS__ placeholder"; exit 1
          fi
          echo "$csp" | grep -qE 'connect-src[^;]*http://api\.example\.test:5005([ ;]|$)' || {
            echo "$csp"; echo "::error::the Content-Security-Policy connect-src does not carry http://api.example.test:5005, the API origin the container was started with"; exit 1; }
          # The quickstart's http://localhost:5005 is the fallback for a console with no API address.
          # This one was started with one, so its policy must not allow localhost as well.
          if echo "$csp" | grep -q 'localhost:5005'; then
            echo "$csp"; echo "::error::connect-src still allows http://localhost:5005 although the container was started with an API origin"; exit 1
          fi
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ci-admin)" = "healthy" ] && break
            sleep 2
          done
          status=$(docker inspect -f '{{.State.Health.Status}}' ci-admin)
          [ "$status" = "healthy" ] || { docker logs ci-admin; echo "::error::the container health is $status"; exit 1; }
          docker rm -f ci-admin >/dev/null

      # The point of #167: this is the same image as the step above, started with a base path
      # instead of without one. If it ever takes a rebuild again, every site stops being the same
      # image with different configuration, which is the whole configured-sites plan.
      - name: The same image serves under a path prefix
        run: |
          set -euo pipefail
          docker run -d --name ci-admin-prefix -p 3301:3000 \
            --read-only --tmpfs /tmp:rw,mode=1777,size=128m \
            -e BARAKO_BASE_PATH=/barakocms \
            -e NEXT_PUBLIC_API_URL=http://api.example.test:5005 barako-brew:ci
          for _ in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3301/barakocms/login || true)" = "200" ] && break
            sleep 2
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3301/barakocms/login || true)
          [ "$code" = "200" ] || { docker logs ci-admin-prefix; echo "::error::/barakocms/login answered $code"; exit 1; }

          # A 200 is not enough: a page whose scripts are addressed at the root renders blank behind
          # the proxy, and that is exactly the failure a baked-in path was hiding.
          curl -s http://127.0.0.1:3301/barakocms/login > prefixed.html
          grep -q '/barakocms/_next/' prefixed.html || {
            echo "::error::the prefixed page addresses its assets outside the base path"; exit 1; }
          grep -q '/barakocms/env-config.js' prefixed.html || {
            echo "::error::the prefixed page reads env-config.js outside the base path"; exit 1; }
          if grep -q '__BARAKO_BASE_PATH__' prefixed.html; then
            echo "::error::the placeholder base path survived into the served page"; exit 1
          fi

          asset=$(grep -o '/barakocms/_next/static/[^"]*\.js' prefixed.html | head -1 || true)
          [ -n "$asset" ] || { echo "::error::no /_next asset to fetch"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3301$asset" || true)
          [ "$code" = "200" ] || { echo "::error::$asset answered $code"; exit 1; }

          # And nothing at the root, the way a real basePath build behaves.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3301/login || true)
          [ "$code" = "404" ] || { echo "::error::/login answered $code on a prefixed console, expected 404"; exit 1; }
          docker rm -f ci-admin-prefix >/dev/null

      # A build ARG that changes what the image serves is how the base path came to need a second
      # image. Proven to refuse, against a fixture, because a gate nobody has watched refuse is a
      # gate nobody should trust.
      - name: The Dockerfile declares no unagreed build ARG
        run: bash scripts/check-dockerfile-args.sh

      - name: The build ARG gate refuses a new routing ARG
        run: |
          set -uo pipefail
          code=0
          out=$(bash scripts/check-dockerfile-args.sh scripts/testdata/dockerfile-new-arg/Dockerfile 2>&1) || code=$?
          echo "$out"
          [ "$code" -ne 0 ] || { echo "::error::the gate passed a Dockerfile with an undeclared ARG"; exit 1; }
          echo "$out" | grep -q 'ARG NEXT_TRAILING_SLASH' || {
            echo "::error::the gate failed, but not because of the fixture's new ARG"; exit 1; }

      # `docker compose config` parses the file, resolves every variable and fails on the first one
      # that has no value. The quickstart is what a newcomer runs first, so a broken one costs the
      # most at the worst moment.
      - name: The quickstart compose file resolves
        env:
          DB_PASSWORD: ci-not-a-real-password
          JWT_KEY: ci-not-a-real-key-at-least-32-characters
          ADMIN_PASSWORD: ci-not-a-real-password
        run: |
          set -euo pipefail
          docker compose -f quickstart/docker-compose.yml config > quickstart.resolved
          grep -q 'ghcr.io/baryodev/barako-cms:' quickstart.resolved
          grep -q 'ghcr.io/baryodev/barako-brew:' quickstart.resolved
          if grep -qE '^[[:space:]]+build:' quickstart.resolved; then
            echo "::error::quickstart/docker-compose.yml resolves to a build step; it must run published images"; exit 1
          fi
          echo "quickstart/docker-compose.yml resolves"

  sbom:
    name: SBOM generates
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      # The same command as the API repository's release used for this image, so the file a release
      # ships is the file this job proves. A tool that writes nothing still exits 0, so the file is
      # checked rather than the command.
      - name: Generate the SBOM
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          mkdir -p sbom
          # Pinned, so a new release of the tool is a reviewed change and not whatever npm serves today.
          npx --yes @cyclonedx/cyclonedx-npm@7.0.0 --output-file sbom/barako-brew.cdx.json package.json
          f=sbom/barako-brew.cdx.json
          [ -s "$f" ] || { echo "::error::$f is missing or empty."; exit 1; }
          COMPONENTS=$(python3 -c "import json; print(len(json.load(open('$f')).get('components', [])))")
          [ "$COMPONENTS" -gt 0 ] || { echo "::error::$f lists no components, so it describes nothing."; exit 1; }
          echo "$f: $COMPONENTS components" >> "$GITHUB_STEP_SUMMARY"

  # The console against the real API, with nothing mocked.
  #
  # Every other job mocks the API with page.route, so it proves the console behaves correctly given
  # fixtures the same person wrote, and cannot prove those fixtures match the server. That gap
  # shipped a bug and kept it: the History panel read `versions` from a response that had returned
  # `items` since the envelope change, rendered an empty list rather than failing, and every mocked
  # spec stayed green because the mock returned `versions` too.
  #
  # Which API image it runs depends on the event, because the two want opposite things (#58):
  #
  #   pull_request, merge_group, push   the release in .github/barako-api-version. A red run means
  #                                     the console changed, never that an image was rebuilt elsewhere.
  #   schedule, workflow_dispatch       :master, published on every barakoCMS master push. A red run
  #                                     means the API moved, and the nightly-issue job below says so.
  #
  # The pin moves by pull request, so the bump runs this job against the new release before it lands.
  #
  # An arm runner. Both tags are published for arm64 and amd64; arm is what this job was proven on,
  # and it is free for public repositories.
  smoke:
    name: Console against the real API
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # An event with no rule fails here rather than falling back to a tag, so a new trigger has to
      # say which API it means.
      - name: Pick the API image for this event
        id: api
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request|merge_group|push) tag=$(tr -d '[:space:]' < .github/barako-api-version) ;;
            schedule|workflow_dispatch) tag=master ;;
            *) echo "::error::no API tag is defined for the $EVENT event"; exit 1 ;;
          esac
          [ -n "$tag" ] || { echo "::error::.github/barako-api-version is empty"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "API image for $EVENT: ghcr.io/baryodev/barako-cms:$tag" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stand up the stack and run the unmocked pack
        env:
          BARAKO_API_TAG: ${{ steps.api.outputs.tag }}
        run: bash scripts/smoke-check.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: smoke-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Only the functional smoke feeds this. Image scan results never do (see nightly-image-scan).
  # A failed nightly opens one tracking issue, or comments on it if it is already open. Pull
  # requests run the pinned release, so they stay green while :master is red, and without this a
  # stale pin or an API change the console has to follow would only show as a red run nobody opened.
  nightly-issue:
    name: Report a failed nightly
    needs: smoke
    if: github.event_name == 'schedule' && failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or comment on the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Nightly: console against barako-cms:master failed"
          body="The unmocked pack failed against \`ghcr.io/baryodev/barako-cms:master\`: $RUN_URL

          Pull requests run the release pinned in \`.github/barako-api-version\`, so they stay green while this is red. Either the API changed in a way the console has to follow, or the pin is behind. Close this once the nightly is green again."

          # An exact title match over the open issues, not a search: search is indexed with a delay
          # and matches words, so it can miss the issue or find a different one.
          number=$(gh issue list --state open --limit 500 --json number,title \
            | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')

          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "commented on #$number"
          else
            gh issue create --title "$title" --body "$body"
          fi

  # The published image again, every night. A new advisory lands against an image that was clean
  # when it shipped, and nothing else would look. High or Critical with a fix fails the run and the
  # findings go to code scanning as SARIF.
  #
  # Findings are never posted as issues. This job has no issues permission and is not a dependency
  # of nightly-issue, which only reports the smoke job and never carries scan results. The
  # repository is public, so an issue naming an unpatched vulnerability tells everyone before the
  # fix ships.
  nightly-image-scan:
    name: Scan the published image
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Trivy
        run: bash scripts/install-trivy.sh

      - name: Scan the latest published image
        run: |
          set -uo pipefail
          trivy image --scanners vuln --severity HIGH,CRITICAL --format json \
            --output image-scan.json ghcr.io/baryodev/barako-brew:latest
          trivy convert --format sarif --output image-scan.sarif image-scan.json
          bash scripts/image-scan-gate.sh image-scan.json | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      # After the scan, and even when it failed, so the findings reach code scanning either way.
      - name: Upload the findings to code scanning
        if: always() && hashFiles('image-scan.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: image-scan.sarif
          category: published-image

  # Lean only stays lean if something notices weight coming back (#853). This builds the production
  # image, boots it with a dummy API address that nothing listens on, and records image size,
  # startup to /login and memory at rest. Each is compared with perf-budget.json, and the summary
  # shows the baseline, this run and the budget. Raising a budget is an edit to that file, so it is
  # reviewed. Both architectures run because both ship. The numbers are uploaded on every run, so a
  # slow creep across pull requests shows. It needs no secret.
  perf-budget:
    name: Performance budget (${{ matrix.arch }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prove the budget comparison can fail
        run: bash scripts/test-perf-budget.sh

      - name: Prove the image size is read from the saved layers
        run: bash scripts/test-perf-image-size.sh

      - name: Measure the image and the running console
        run: bash scripts/perf-measure.sh "$RUNNER_TEMP/perf.json"

      - name: Compare with perf-budget.json
        run: python3 scripts/perf-budget.py "$RUNNER_TEMP/perf.json" perf-budget.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: perf-${{ matrix.arch }}
          path: ${{ runner.temp }}/perf.json
          if-no-files-found: ignore
          retention-days: 90

  # Proves the release gate can fail, rather than trusting it because it has never fired.
  #
  # scripts/check-image-platforms.sh is what stands between a release and an amd64-only tag, and it
  # runs only during a publish, which is the one place it is expensive to be wrong. So it is
  # exercised here against two published tags whose shape is already known: barako-admin:3.21.0 is
  # amd64 only, which is the defect #37 is about, and :latest carries both architectures.
  #
  # Both directions on purpose. A gate that refuses everything would satisfy the negative case
  # alone and block every release.
  image-platform-gate:
    name: Image platform gate refuses an amd64-only tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The script only reads a public registry; leave no token behind for it to find.
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: An amd64-only tag is refused, and for the right reason
        run: |
          set -uo pipefail
          # Actions runs this under bash -e. Capturing the status on the same line keeps -e from
          # ending the step at the assignment, before the output is read.
          code=0
          out=$(bash scripts/check-image-platforms.sh ghcr.io/baryodev/barako-admin:3.21.0 2>&1) || code=$?
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::the gate passed an amd64-only tag"; exit 1
          fi
          # A network error also exits 1. Only the mismatch message counts as the gate working.
          echo "$out" | grep -q "serves 'linux/amd64', expected 'linux/amd64,linux/arm64'" || {
            echo "::error::the gate failed, but not because the tag is amd64 only (exit $code)"; exit 1; }

      - name: A multi-architecture tag is accepted
        run: bash scripts/check-image-platforms.sh ghcr.io/baryodev/barako-admin:latest
