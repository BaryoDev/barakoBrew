blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/BaryoDev/barakoBrew/security/advisories/new
    about: Report privately. Please do not open a public issue for anything exploitable.
  - name: A bug in the API (barakoCMS)
    url: https://github.com/BaryoDev/barakoCMS/issues/new/choose
    about: If the same request fails against the API directly, it belongs there rather than here.
      A quick way to tell is to repeat the action with curl.
  - name: Chat on Discord
    url: https://discord.gg/7GYKzDx7Z2
    about: Ask a quick question, say hello, or talk through an idea before opening an issue.
  - name: Question or idea
    url: https://github.com/BaryoDev/barakoCMS/discussions
    about: For anything open-ended, or to sound out a large change before building it.
  - name: How to contribute
    url: https://github.com/BaryoDev/barakoBrew/blob/master/CONTRIBUTING.md
    about: Branch naming, the test requirement for bug fixes, and how the console is meant to be written.
