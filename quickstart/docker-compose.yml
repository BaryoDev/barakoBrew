# barakoBrew quickstart: Postgres, the barakoCMS API (the full suite image) and the console, from
# published images. Nothing to build.
#
#   1.  cp .env.example .env
#   2.  edit .env  (at minimum: DB_PASSWORD, JWT_KEY, ADMIN_PASSWORD)
#   3.  docker compose up -d
#
# Console:   http://localhost:${ADMIN_PORT:-3000}
# API:       http://localhost:${API_PORT:-5005}
#
# Both ports are bound to 127.0.0.1. To reach them from another machine, put a reverse proxy in
# front (see README.md, "Behind a domain"), or change the ports lines to "0.0.0.0:...".
#
# Every container drops all Linux capabilities and cannot gain new ones. The console and Postgres
# also run with a read-only root filesystem and a tmpfs for what they write. The API does not: its
# image has no shell to prove what it writes where, so it keeps a writable filesystem.
#
# The API image carries every module; each stays off or on a mock until its keys are set. The API
# repository's quickstart lists them: https://github.com/BaryoDev/barakoCMS/tree/master/quickstart

services:
  postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d # postgres:16-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    cap_drop: [ALL]
    # What the image's entrypoint needs to own the data directory and start Postgres as its user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: ${DB_NAME:-barakocms}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # The suite: core plus every module. For the lean core swap in ghcr.io/baryodev/barako-cms-decaf.
    # 5.8.0 is the newest release the console in this repository's compatibility table supports.
    image: ghcr.io/baryodev/barako-cms:${BARAKO_API_TAG:-5.8.0}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-5005}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=${DB_NAME:-barakocms};Username=${DB_USER:-postgres};Password=${DB_PASSWORD}"
      # Must be 32+ characters or the API refuses to start.
      JWT__Key: ${JWT_KEY:?set a 32+ char JWT_KEY in .env}
      InitialAdmin__Username: ${ADMIN_USERNAME:-admin}
      InitialAdmin__Password: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      # The console's origin. The browser talks to the API directly, so this has to match where the
      # console is served from.
      CORS__AllowedOrigins: ${ALLOWED_ORIGINS:-http://localhost:${ADMIN_PORT:-3000}}
      Seed__DemoContent: ${SEED_DEMO_CONTENT:-false}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      # The public URL of this deployment, used for every absolute link the API hands out. Leave it
      # unset on localhost.
      App__BaseUrl: ${APP_BASE_URL:-}
      # The Host headers the API answers to, separated by semicolons. barakoCMS 6.0 refuses to start
      # in Production when this is empty or "*", so the default is the two names this quickstart is
      # reached by. Set ALLOWED_HOSTS to your domain when you put one in front.
      AllowedHosts: ${ALLOWED_HOSTS:-localhost;127.0.0.1}
      ForwardedHeaders__Enabled: ${FORWARDED_HEADERS_ENABLED:-false}
      ForwardedHeaders__KnownNetworks__0: ${TRUSTED_PROXY_NETWORK:-}

  console:
    # Pin BARAKO_CONSOLE_TAG to a release.
    image: ghcr.io/baryodev/barako-brew:${BARAKO_CONSOLE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    # The console released after 1.13.0 runs from a copy under /tmp and can run read-only, so set
    # CONSOLE_READ_ONLY=true with it. The default turns true when that release ships.
    read_only: ${CONSOLE_READ_ONLY:-false}
    # entrypoint.sh copies the server here, writes the API address and base path into the copy, and
    # runs from it. The image itself is never written to.
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # Any answer below 500 is a live server. No curl in the image, so node asks.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3000}:3000"
    environment:
      # Where the browser reaches the API. Read at container start, so repointing is a restart.
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:${API_PORT:-5005}}
      # The barakoPress site that renders the pages. Unset leaves a page's Blocks field as JSON.
      NEXT_PUBLIC_PRESS_URL: ${PUBLIC_PRESS_URL:-}
      # A sub-path such as /cms to serve the console under. Unset serves the domain root.
      BARAKO_BASE_PATH: ${CONSOLE_BASE_PATH:-}

volumes:
  pgdata:
